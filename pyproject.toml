[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bus"
version = "0.4.0"
description = "Local MCP server + CLI letting multiple Claude Code instances exchange messages over a shared SQLite bus with audit logging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-bus" }]
keywords = ["mcp", "claude-code", "claude", "agents", "messaging", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.0",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/zb-ss/agent-group-mcp"
Issues = "https://github.com/zb-ss/agent-group-mcp/issues"
Source = "https://github.com/zb-ss/agent-group-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
agent-bus = "agent_bus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
